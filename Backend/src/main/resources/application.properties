# ── Server ──────────────────────────────────────────────────────────────────
server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ── MongoDB ──────────────────────────────────────────────────────────────────
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/adaptive_learning
spring.data.mongodb.database=adaptive_learning
spring.data.mongodb.auto-index-creation=true

# ── Relational DB (Fallback for PGVector) ────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:lmsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.lms=INFO
logging.level.org.springframework.data.mongodb=WARN
# Include requestId and userId from MDC in every log line
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] [%X{requestId}] [%X{userId}] %-5level %logger{36} - %msg%n

# ── JWT Security ─────────────────────────────────────────────────────────────
# REQUIRED: Set a strong secret (>=32 chars) via environment variable or here.
# Production: export ABF_JWT_SECRET=<strong-random-string>
# The application will FAIL TO START if this is blank.
app.jwt.secret=${ABF_JWT_SECRET:abf-change-this-secret-key-minimum-32-chars-required}
app.jwt.access-token-validity-ms=36000000
app.jwt.refresh-token-validity-ms=2592000000

# ── CORS ─────────────────────────────────────────────────────────────────────
# Comma-separated list of allowed origins. No wildcard in production.
app.cors.allowed-origins=http://localhost:4200,http://localhost:8080,http://localhost:5173

# ── In-memory cache ──────────────────────────────────────────────────────────
app.cache.ttl-seconds=600
app.cache.ai-eval-ttl-seconds=3600

# ── AI / Mistral ───────────────────────────────────────────────────────────────
app.ai.mistral.api-url=http://127.0.0.1:11434/v1/chat/completions
app.ai.mistral.api-key=${MISTRAL_API_KEY:mistral-placeholder-key}
app.ai.mistral.model=mistral
app.ai.timeout-ms=300000
app.ai.fast-mode=false
app.ai.fast-model=phi3.5
app.ai.production-model=mistral
app.ai.concurrency=1
app.ai.max-response-chars=3000
app.ai.max-retries=2

# ── Adaptive engine ───────────────────────────────────────────────────────────
app.adaptive.starting-level=2
app.adaptive.weak-topic-level=2
app.adaptive.weak-student-accuracy=50.0
app.adaptive.correct-streak-to-level=2

# ── Metrics & Actuator ─────────────────────────────────────────────────────────
app.metrics.enabled=true
app.metrics.slow-request-threshold-ms=2000

# Expose health, info, prometheus. Prometheus is protected by ROLE_ADMIN in SecurityConfig.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=true

# Application info shown on /actuator/info
info.app.name=ABF Adaptive Learning Platform
info.app.version=2.0.0
info.app.description=Production-grade AI-powered adaptive learning backend

# ── Scheduling (TokenBlacklistService cleanup, future tasks) ──────────────────
spring.task.scheduling.pool.size=2

# ── Resilience4j ─────────────────────────────────────────────────────────────
# Retry: 3 attempts with exponential backoff (2s, 4s)
resilience4j.retry.instances.aiService.max-attempts=3
resilience4j.retry.instances.aiService.wait-duration=2s
resilience4j.retry.instances.aiService.enable-exponential-backoff=true
resilience4j.retry.instances.aiService.exponential-backoff-multiplier=2

# Circuit Breaker: opens after 60% failure rate over 20 calls
# Stays open for 30s, then lets 5 calls through to test recovery
resilience4j.circuitbreaker.instances.aiService.sliding-window-size=10
resilience4j.circuitbreaker.instances.aiService.failure-rate-threshold=100
resilience4j.circuitbreaker.instances.aiService.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.aiService.permitted-number-of-calls-in-half-open-state=10
resilience4j.circuitbreaker.instances.aiService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.aiService.automatic-transition-from-open-to-half-open-enabled=true

# ── Feature Toggles ───────────────────────────────────────────────────────────
features.summary=true
features.flashcards=true
features.quiz=true
features.mindmap=true
features.podcast=true

features.knowledgeGraph=false
features.slides=false
features.embeddings=false
features.relatedConcepts=false

# ── Kokoro TTS Configuration ──────────────────────────────────────────────────
app.ai.kokoro.python-path=C:\\Users\\sanju\\AppData\\Local\\Programs\\Python\\Python311\\python.exe
app.ai.kokoro.script-path=kokoro_tts.py
app.ai.kokoro.timeout-sec=120

